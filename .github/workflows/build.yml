name: Build community catalog

on:
  pull_request:
    paths:
      - "codes/**"
  push:
    branches: [main]
    paths:
      - "codes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    if: ${{ !github.event.repository.fork }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Select packages to scan
        id: scan-scope
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const scanInputs = new Set([
              ".semgrep.yml", "scripts/scan_packages.py", "scripts/build_catalog.py",
              ".github/workflows/build.yml", ".github/workflows/semgrep-pr-comment.yml",
            ]);
            const scanAll = files.some(file =>
              scanInputs.has(file.filename) || scanInputs.has(file.previous_filename));
            if (scanAll || files.length < context.payload.pull_request.changed_files) return;

            const archives = [...new Set(files
              .filter(file => file.status !== "removed" &&
                /^codes\/[^/]+\.zip$/.test(file.filename))
              .map(file => file.filename))].sort();
            core.setOutput("archives", JSON.stringify(archives));
      - name: Validate packages
        run: python scripts/build_catalog.py --check
      - name: Install Semgrep Community Edition
        run: python -m pip install semgrep==1.185.0
      - name: Scan package Python code
        env:
          CHANGED_PACKAGE_ARCHIVES: ${{ steps.scan-scope.outputs.archives }}
          SCAN_REPORT_PATH: ${{ runner.temp }}/semgrep-findings.json
        run: |
          $scanArgs = @()
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $scanArgs += @('--report-file', $env:SCAN_REPORT_PATH)
            if ($env:CHANGED_PACKAGE_ARCHIVES) {
              $scanArgs += @('--archives-json', $env:CHANGED_PACKAGE_ARCHIVES)
            }
          }
          python scripts/scan_packages.py @scanArgs
      - name: Upload Semgrep report for PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-findings-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semgrep-findings.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Test catalog builder
        run: python -m unittest discover -s tests -p "test_*.py"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Configure runner
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build teams.json
        run: python scripts/build_catalog.py
      - name: Commit generated catalog
        if: vars.CN_AHEAD != 'true'
        run: |
          git diff --quiet -- teams.json
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teams.json
          git commit -m "chore: update community catalog [skip ci]"
          git push
      - name: Initialize empty CNB repository
        env:
          CNB_GH: ${{ secrets.CNB_GH }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP "ok-nte-char-code-cnb-bootstrap"
          git clone "https://cnb:$env:CNB_GH@cnb.cool/BnanZ0/ok-nte-char-code.git" $target
          git -C $target rev-parse --verify HEAD 2>$null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git -C $target config user.name "ok-nte catalog bot"
          git -C $target config user.email "110257560+BnanZ0@users.noreply.github.com"
          git -C $target checkout --orphan main
          New-Item -ItemType Directory -Force -Path (Join-Path $target "codes") | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $target "codes/.gitkeep") | Out-Null
          Set-Content -NoNewline -Encoding utf8 (Join-Path $target "teams.json") "{`n  `"format_version`": 1,`n  `"packages`": []`n}`n"
          git -C $target add codes/.gitkeep teams.json
          git -C $target commit -m "chore: initialize community catalog"
          git -C $target push origin refs/heads/main:refs/heads/main
      - name: Synchronize CNB repository
        env:
          CNB_GH: ${{ secrets.CNB_GH }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP "ok-nte-char-code-cnb-sync"
          $target = [System.IO.Path]::GetFullPath($target)
          git clone "https://cnb:$env:CNB_GH@cnb.cool/BnanZ0/ok-nte-char-code.git" $target
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone CNB repository" }
          git -C $target config user.name "ok-nte catalog bot"
          git -C $target config user.email "110257560+BnanZ0@users.noreply.github.com"

          $targetCodes = [System.IO.Path]::GetFullPath((Join-Path $target "codes"))
          $targetPrefix = $target.TrimEnd([System.IO.Path]::DirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
          if (-not $targetCodes.StartsWith($targetPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to replace a path outside the CNB checkout"
          }
          if (Test-Path -LiteralPath $targetCodes) {
            Remove-Item -LiteralPath $targetCodes -Recurse -Force
          }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "codes") -Destination $target -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "teams.json") -Destination $target -Force

          git -C $target add --all codes teams.json
          if ($LASTEXITCODE -ne 0) { throw "Failed to stage CNB catalog files" }
          git -C $target diff --cached --quiet
          $diffStatus = $LASTEXITCODE
          if ($diffStatus -eq 0) { Write-Host "CNB catalog is already up to date"; exit 0 }
          if ($diffStatus -ne 1) { throw "Failed to inspect CNB changes" }
          git -C $target commit -m "chore: sync community catalog"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit CNB catalog" }
          git -C $target push origin refs/heads/main:refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to push CNB catalog" }
