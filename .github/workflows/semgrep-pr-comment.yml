name: Comment Semgrep findings on PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      body:
        required: true
        type: string

permissions:
  pull-requests: write

jobs:
  comment:
    if: github.event.sender.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { pr_number, head_sha, base_ref, body } = context.payload.inputs;
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: Number(pr_number),
            });
            if (pr.state !== "open" || pr.head.sha !== head_sha || pr.base.ref !== base_ref) {
              return core.notice("The pull request changed after the Semgrep scan.");
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
