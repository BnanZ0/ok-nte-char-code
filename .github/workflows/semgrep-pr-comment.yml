name: Comment Semgrep findings on PR

on:
  workflow_run:
    workflows: ["Build community catalog"]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: semgrep-findings
          path: ${{ runner.temp }}/semgrep-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/github-script@v9
        env:
          REPORT_PATH: ${{ runner.temp }}/semgrep-report/semgrep-findings.json
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- ok-nte-semgrep-report -->";
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100,
            });
            const pr = pullRequests.find(item => item.head.sha === run.head_sha);
            if (!pr) return core.notice("No open PR matches this scan commit.");

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const changed = new Set(files
              .filter(file => file.status !== "removed" && /^codes\/[^/]+\.zip$/.test(file.filename))
              .map(file => file.filename));
            if (!fs.existsSync(process.env.REPORT_PATH)) {
              return core.warning("The Semgrep report was not uploaded.");
            }
            if (fs.statSync(process.env.REPORT_PATH).size > 1_000_000) {
              return core.warning("The Semgrep report is too large.");
            }
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
            if (report.schema_version !== 1 || !Array.isArray(report.findings)) {
              throw new Error("Invalid Semgrep report.");
            }
            const findings = report.findings.filter(item =>
              changed.has(item.archive) && typeof item.path === "string" &&
              typeof item.rule_id === "string" && Number.isInteger(item.line) &&
              ["ERROR", "WARNING", "INFO"].includes(item.severity));
            const escape = value => String(value).slice(0, 300)
              .replace(/[\r\n\t]/g, " ").replace(/&/g, "&amp;")
              .replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/@/g, "&#64;");
            const code = value => `\`${escape(value).replace(/`/g, "&#96;")}\``;
            const severityOrder = { ERROR: 0, WARNING: 1, INFO: 2 };
            const severityCounts = findings.reduce((counts, item) => {
              counts[item.severity] = (counts[item.severity] || 0) + 1;
              return counts;
            }, {});
            const severitySummary = Object.entries(severityOrder)
              .filter(([severity]) => severityCounts[severity])
              .map(([severity]) => `${severityCounts[severity]} ${severity.toLowerCase()}${severityCounts[severity] === 1 ? "" : "s"}`)
              .join(", ");
            const groups = new Map();
            const orderedFindings = [...findings].sort((a, b) =>
              severityOrder[a.severity] - severityOrder[b.severity] ||
              a.rule_id.localeCompare(b.rule_id) || a.archive.localeCompare(b.archive) ||
              a.path.localeCompare(b.path) || a.line - b.line);
            for (const item of orderedFindings.slice(0, 30)) {
              const key = `${item.severity}\0${item.rule_id}`;
              let group = groups.get(key);
              if (!group) {
                group = { severity: item.severity, ruleId: item.rule_id, count: 0, messages: new Map() };
                groups.set(key, group);
              }
              group.count++;
              const message = typeof item.message === "string" ? item.message : "";
              let archives = group.messages.get(message);
              if (!archives) group.messages.set(message, archives = new Map());
              let paths = archives.get(item.archive);
              if (!paths) archives.set(item.archive, paths = new Map());
              let lines = paths.get(item.path);
              if (!lines) paths.set(item.path, lines = new Map());
              lines.set(item.line, (lines.get(item.line) || 0) + 1);
            }
            const icons = { ERROR: "❌", WARNING: "⚠️", INFO: "ℹ️" };
            const sections = [...groups.values()].map(group => {
              const messageBlocks = [...group.messages.entries()].map(([message, archives]) => {
                const details = [...archives.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([archive, paths]) => {
                  const count = [...paths.values()].reduce((total, lines) =>
                    total + [...lines.values()].reduce((sum, matches) => sum + matches, 0), 0);
                  const locations = [...paths.entries()].sort(([a], [b]) => a.localeCompare(b))
                    .map(([path, lines]) => `  - ${code(path)}: ${[...lines.entries()].sort(([a], [b]) => a - b)
                      .map(([line, matches]) => `L${line}${matches > 1 ? ` (${matches})` : ""}`).join(", ")}`);
                  return [`- **${code(archive)}** (${count})`, ...locations].join("\n");
                });
                return [...(message ? [`> ${escape(message)}`, ""] : []), ...details].join("\n");
              });
              return `### ${icons[group.severity]} ${code(group.severity)} · ${code(group.ruleId)} (${group.count})\n\n${messageBlocks.join("\n\n")}`;
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === "Bot" && comment.body?.includes(marker));
            const archivesWithFindings = new Set(findings.map(item => item.archive)).size;
            const summary = findings.length
              ? `**${findings.length} findings** across **${archivesWithFindings} archives** (`${severitySummary}`) · *Please review manually.*`
              : "✅ No findings in the changed package ZIPs.";
            const truncated = findings.length > 30
              ? `Showing the first 30 findings; rule and archive counts below reflect the displayed findings.`
              : "";
            const body = [marker, "## 🔍 Semgrep findings in changed packages", "", summary,
              truncated, ...sections].filter(Boolean).join("\n\n");
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else if (findings.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }


